name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Format · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # Codigo y dependencias que ya no usa nadie. Cazo asi `zustand`, que
      # llevaba diecisiete sprints instalada sin una sola importacion, y nueve
      # exportaciones muertas mas.
      #
      # Los barriles (`index.ts`) van como puntos de entrada: sin eso, cada
      # reexportacion que nadie importa por ahi salia como muerta y eran
      # treinta y una de ruido. El precio es que algo alcanzable **solo** por
      # un barril no se ve; el resto del codigo si, comprobado metiendo una
      # funcion muerta a proposito.
      - name: Dead code
        run: npm run knip

      - name: Build
        run: npm run build

      # El paquete se descarga entero al instalar la aplicacion en el telefono.
      # Sin un tope, crece de PR en PR sin que nadie lo note.
      - name: Bundle size
        run: npm run size
