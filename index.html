<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignora los iconos del manifiesto: usa éste al añadir a la pantalla
         de inicio, y tiene que ser PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- El mismo negro que `--background` en globals.css, hsl(250 18% 5%). Si
         no coinciden, la barra de estado del teléfono se queda de otro color
         que la pantalla y se nota al abrir. -->
    <meta name="theme-color" content="#0B0A0F" />
    <meta name="description" content="Nexus — tu sistema operativo personal adaptativo." />
    <title>Nexus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
